<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Forms</title>
</head>
<body>
  <!--
    Netlify Forms blueprint. Netlify reads this file at deploy time to register
    the form; visitors never see it. The /book page posts here with fetch.
    Field names must match what src/components/booking-flow.tsx submits.
  -->
  <form name="event-booking" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="event-booking">
    <input name="bot-field">
    <input name="event_type">
    <input name="event_date">
    <input name="preferred_time">
    <input name="availability_status">
    <input name="full_name">
    <input type="email" name="email">
    <input type="tel" name="phone">
    <input name="organization">
    <input name="venue_name">
    <input name="city">
    <input type="number" name="guest_count">
    <input name="event_setting">
    <textarea name="notes"></textarea>
  </form>
</body>
</html>
